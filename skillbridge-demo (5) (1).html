<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>SkillBridge (Demo)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f1e;--solid:#131936;--card:rgba(255,255,255,.06);--ink:#eef1ff;--mut:#9aa5cb;--line:rgba(255,255,255,.13);--pri:#2ee6c5;--pri2:#7a7bff;--ok:#2ee6c5;--soft:rgba(46,230,197,.13);--on:#06101a;--sh:0 14px 34px -14px rgba(0,0,0,.6);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef1fb;--solid:#fff;--card:rgba(255,255,255,.78);--ink:#131735;--mut:#575f86;--line:rgba(19,23,53,.13);--pri:#07856f;--pri2:#4b4fd8;--ok:#07856f;--soft:rgba(7,133,111,.11);--on:#fff;--sh:0 12px 28px -16px rgba(40,50,110,.35);color-scheme:light}}:root[data-theme=light]{--bg:#eef1fb;--solid:#fff;--card:rgba(255,255,255,.78);--ink:#131735;--mut:#575f86;--line:rgba(19,23,53,.13);--pri:#07856f;--pri2:#4b4fd8;--ok:#07856f;--soft:rgba(7,133,111,.11);--on:#fff;--sh:0 12px 28px -16px rgba(40,50,110,.35);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Outfit,'Noto Sans Devanagari','Noto Sans Tamil',system-ui,sans-serif;min-height:100%}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60vmax 42vmax at 8% -12%,rgba(122,123,255,.32),transparent 62%),radial-gradient(48vmax 38vmax at 100% 8%,rgba(46,230,197,.2),transparent 62%),radial-gradient(40vmax 30vmax at 55% 115%,rgba(255,138,101,.15),transparent 62%)}
h1,h2,h3,.logo,.ring b{font-family:'Bricolage Grotesque',Outfit,system-ui,sans-serif}
h1,h2,h3{margin:0 0 .4em;line-height:1.1;letter-spacing:-.02em}h1{font-size:clamp(34px,6vw,64px);font-weight:800;letter-spacing:-.035em}h2{font-size:24px;font-weight:700}h3{font-size:17px;font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--solid);min-height:46px}
input[type=checkbox]{accent-color:var(--pri)}textarea{min-height:76px}label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.btn{min-height:46px;padding:0 22px;border-radius:999px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);font-weight:700;cursor:pointer;box-shadow:0 10px 26px -10px var(--pri2);transition:transform .15s,filter .15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.g:hover{border-color:var(--pri)}.btn.sm{min-height:38px;padding:0 16px;font-size:14px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;letter-spacing:-.03em;background:linear-gradient(120deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:12px}
.top nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}.top nav button{background:none;border:0;min-height:44px;padding:0 15px;border-radius:999px;cursor:pointer;color:var(--mut);font-weight:600;transition:background .15s,color .15s}
.top nav button:hover{color:var(--ink);background:var(--soft)}.top nav button.on{color:var(--on);background:linear-gradient(135deg,var(--pri),var(--pri2))}
.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 70px}
.grid{display:grid;grid-template-columns:250px 1fr;gap:20px}.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);backdrop-filter:blur(14px);border-radius:22px;padding:18px;box-shadow:var(--sh);border:1px solid var(--line);transition:transform .18s,border-color .18s}
article.card:hover{transform:translateY(-4px);border-color:var(--pri)}
article.t-x{border-top:3px solid var(--pri)}article.t-l{border-top:3px solid var(--pri2)}article.t-p{border-top:3px solid #ff8a65}
.mt{font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:-4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mut{color:var(--mut);font-size:14px}.stack>*+*{margin-top:12px}
.badge{display:inline-block;padding:2px 11px;border-radius:999px;font-size:13px;font-weight:600;margin:2px 4px 2px 0;background:hsl(var(--h,170) 85% 60%/.15);color:hsl(var(--h,170) 90% 74%);border:1px solid hsl(var(--h,170) 85% 60%/.35)}
.badge.l{border-style:dashed}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) .badge{color:hsl(var(--h,170) 75% 28%);background:hsl(var(--h,170) 80% 50%/.14)}}:root[data-theme=light] .badge{color:hsl(var(--h,170) 75% 28%);background:hsl(var(--h,170) 80% 50%/.14)}
.av{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;color:#fff;font-weight:800;font-family:'Bricolage Grotesque',Outfit,sans-serif;flex:none;box-shadow:0 8px 18px -8px rgba(0,0,0,.5)}
.ring{--p:50;--c:var(--pri);width:70px;height:70px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none;border:0;cursor:pointer;box-shadow:0 0 24px -6px var(--c);transition:transform .15s}
.ring:hover{transform:scale(1.07)}.ring b{width:56px;height:56px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font-size:17px;font-weight:800}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:46px 30px;margin-bottom:22px;color:var(--ink);background:linear-gradient(135deg,rgba(46,230,197,.17),rgba(122,123,255,.26));border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-130px;top:-150px;width:460px;height:460px;border-radius:50%;pointer-events:none;background:repeating-radial-gradient(circle,transparent 0 22px,var(--line) 23px 24px)}
.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(30px,4.3vw,52px);max-width:15em;text-wrap:balance}.hero h1[style]{font-size:34px}.hero p{max-width:560px;color:var(--mut);font-size:17px}
.hero input{max-width:580px;font-size:18px;min-height:56px;border-radius:18px;padding:0 20px;box-shadow:var(--sh)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;min-height:38px;padding:0 16px;cursor:pointer;font-weight:500;transition:border-color .15s}
.chip:hover{border-color:var(--pri)}.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri)}
.bridge{width:100%;max-width:760px;margin-top:22px;color:var(--ink);display:block}.arc{stroke-dasharray:700;stroke-dashoffset:700;animation:draw 1.8s .25s ease forwards}.arc2{stroke-dasharray:6 8}
@keyframes draw{to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.arc{animation:none;stroke-dashoffset:0}}
.modal{position:fixed;inset:0;background:rgba(6,9,22,.62);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;padding:14px}.modal>.card{max-width:540px;width:100%;max-height:90vh;overflow:auto;background:var(--solid)}
.err{color:#ff7b7b;font-size:13px}@media(prefers-color-scheme:light){:root:not([data-theme=dark]) .err{color:#c0392b}}:root[data-theme=light] .err{color:#c0392b}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2));border-radius:9px;transition:width .4s}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--solid);color:var(--ink);border:1px solid var(--pri);padding:11px 20px;border-radius:999px;z-index:30;box-shadow:var(--sh)}
.msg{max-width:78%;padding:9px 14px;border-radius:18px 18px 18px 6px;background:var(--soft)}.msg.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on)}
.chat{display:flex;flex-direction:column;gap:8px;min-height:240px;max-height:46vh;overflow:auto;padding:6px}
.flow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px;font-weight:600}.flow span{background:var(--card);border:1px solid var(--line);padding:6px 16px;border-radius:999px}
.bd{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-size:14px;margin-top:8px}
details summary{cursor:pointer;font-weight:600}a{color:var(--pri)}

/* hero carousel */
.hs{min-height:380px;padding-bottom:78px;display:flex;flex-direction:column;justify-content:center;color:#fff;touch-action:pan-y}
.hs::after{display:none}
.hero>.slides{position:absolute;inset:0;z-index:0;pointer-events:none}
.slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.04);transition:opacity .9s ease,transform 6s ease}
.slide.on{opacity:1;transform:scale(1)}
.hero>.shade{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,9,22,.78) 0%,rgba(6,9,22,.5) 55%,rgba(6,9,22,.22) 100%),linear-gradient(0deg,rgba(6,9,22,.6),transparent 40%)}
.hs h1,.hs .hl{text-shadow:0 2px 18px rgba(0,0,0,.45)}
.hs p{color:rgba(255,255,255,.86)}
.hs .chip{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.38);backdrop-filter:blur(6px)}
.hs .chip:hover{border-color:var(--pri)}
.hero>.hctl{position:absolute;z-index:2;left:30px;right:30px;bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.scap{font-size:14px;font-weight:600;color:rgba(255,255,255,.92);display:inline-flex;align-items:center;gap:8px}
.scap::before{content:"";width:22px;height:2px;background:var(--pri);border-radius:2px}
.dots{display:flex;align-items:center;gap:2px}
.dot,.sarr{border:0;background:none;cursor:pointer;color:#fff;display:grid;place-items:center}
.dot{width:26px;height:44px}.dot::before{content:"";width:9px;height:9px;border-radius:99px;background:rgba(255,255,255,.45);transition:width .25s,background .25s}
.dot.on::before{width:26px;background:var(--pri)}
.sarr{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.38);background:rgba(255,255,255,.12);backdrop-filter:blur(6px);font-size:18px;transition:border-color .15s}
.sarr:hover{border-color:var(--pri)}
@media(max-width:560px){.hs{padding:34px 18px 84px}.hero>.hctl{left:14px;right:14px;flex-wrap:wrap}.scap{font-size:13px;flex-basis:100%}.hs .sarr{display:none}}
@media(prefers-reduced-motion:reduce){.slide{transition:opacity .01s;transform:none}}
.land{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:30px;align-items:center}
.lr img{width:100%;height:auto;aspect-ratio:1;object-fit:cover;border-radius:28px;display:block;border:1px solid var(--line);box-shadow:0 30px 70px -26px rgba(46,160,255,.45),var(--sh)}
@media(max-width:820px){.land{grid-template-columns:1fr}.lr{order:-1;max-width:340px;margin:0 auto}}
/* suggestions */
.sug{display:flex;flex-direction:column;gap:10px}
.why{font-size:12.5px;font-weight:600;color:var(--pri)}
.ring.sm{width:58px;height:58px}.ring.sm b{width:46px;height:46px;font-size:14px}
.sugh{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:22px}

/* controls */
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ico{min-width:44px;min-height:44px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:17px;display:grid;place-items:center;padding:0}
.ico:hover{border-color:var(--pri)}
select.lang{width:auto;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* stats strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:0 0 6px}
.stat{padding:16px 18px;text-align:center}
.stat b{display:block;font:800 clamp(26px,4vw,38px)/1.15 'Bricolage Grotesque',Outfit,sans-serif;background:linear-gradient(120deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mut);font-size:14px}
/* why + rating */
.why2{font-size:14px;padding:8px 12px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.rate{font-size:13px;font-weight:600;color:#f0a64a;margin-left:6px}
/* progress + badges */
.ring.st{cursor:default}.ring.st:hover{transform:none}
.bgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.bg{border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center;font-size:21px;line-height:1.2}
.bg small{display:block;font-size:11.5px;font-weight:600;color:var(--mut);margin-top:3px}
.bg:not(.on)>span:first-child{filter:grayscale(1);opacity:.45}
.bg.on{border-color:var(--pri);background:var(--soft)}.bg.on small{color:var(--ink)}
/* match-up animation */
.mm{display:grid;place-items:center;gap:12px;text-align:center;padding:14px 8px}
.mm .stage{position:relative;width:100%;max-width:340px;height:128px}
.mm .mw{position:absolute;top:50px;transform:scale(1.25)}
.mm .l{left:0;animation:inl 1.1s cubic-bezier(.2,.8,.2,1) forwards}
.mm .r{right:0;animation:inr 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes inl{from{transform:translateX(-30px) scale(1.25);opacity:0}to{transform:translateX(74px) scale(1.25);opacity:1}}
@keyframes inr{from{transform:translateX(30px) scale(1.25);opacity:0}to{transform:translateX(-74px) scale(1.25);opacity:1}}
.mm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mm .mmarc{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1s .7s ease forwards}
.mm .pill{font:800 30px/1 'Bricolage Grotesque',Outfit,sans-serif;background:linear-gradient(120deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .5s 1.1s both}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
@media(prefers-reduced-motion:reduce){.mm *{animation:none!important}.mm .l{transform:translateX(74px) scale(1.25)}.mm .r{transform:translateX(-74px) scale(1.25)}.mm .mmarc{stroke-dashoffset:0}}
/* radar */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.radar{width:100%;max-width:440px;height:auto;display:block;margin:0 auto;color:var(--ink)}
.radar text{font-size:11.5px;fill:currentColor;font-family:Outfit,system-ui,sans-serif}

/* chatbot */
.botfab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:56px;height:56px;border-radius:50%;border:0;font-size:24px;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--on);box-shadow:0 12px 28px -8px var(--pri2)}
.botp{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;width:min(380px,calc(100vw - 32px));height:min(540px,calc(100vh - 150px));display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--solid);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh)}
.botp header{display:flex;justify-content:space-between;align-items:center}.botp .chat{flex:1;min-height:0;max-height:none}
.botm{display:flex;flex-direction:column;gap:6px;align-items:flex-start}.botm .msg{max-width:92%}.botp .chip{min-height:34px;font-size:13px}

/* accessibility */
html[data-zoom="1"]{zoom:1.15}html[data-zoom="2"]{zoom:1.3}
html[data-hc]:not(#_){--mut:var(--ink);--line:color-mix(in srgb,var(--ink) 65%,transparent)}html[data-hc] a{text-decoration:underline}
html[data-dys] *{font-family:Verdana,'Trebuchet MS',sans-serif!important;letter-spacing:.03em;word-spacing:.1em}html[data-dys] body{line-height:1.8}
html[data-rm] *,html[data-rm] *::before{animation:none!important;transition:none!important}html[data-rm] .arc,html[data-rm] .mm .mmarc{stroke-dashoffset:0}html[data-rm] .mm .l{transform:translateX(74px) scale(1.25)}html[data-rm] .mm .r{transform:translateX(-74px) scale(1.25)}html[data-rm] .slide{transform:none}
.rg{display:inline-block;animation:rg .5s ease-in-out infinite}@keyframes rg{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.hs{min-height:300px}
</style></head><body><div id="app"></div><div id="ov"></div>

function score(me,u){
 const mL=nm(me.learn),uT=nm(u.teach),uL=nm(u.learn),mT=nm(me.teach);
 const got=mL.filter(n=>uT.includes(n)),give=uL.filter(n=>mT.includes(n));
 const P=[];const add=(k,v,max,note)=>P.push({k,v:Math.round(v*10)/10,max,note});
 add('Skill compatibility',got.length?40*Math.min(1,.6+.4*got.length/Math.min(mL.length||1,3)):0,40,got.length?'Can teach '+got.map(n=>u.teach.find(t=>t.n.toLowerCase()==n).n).join(', '):'');
 add('Reciprocal exchange',got.length&&give.length?20:give.length?8:0,20,give.length?'Wants '+give.join(', ')+' from you':'');
 let ex=0;got.forEach(n=>{const t=LV.indexOf(u.teach.find(x=>x.n.toLowerCase()==n).e),l=['Beginner','Intermediate','Advanced'].indexOf(me.learn.find(x=>x.n.toLowerCase()==n).l);ex=Math.max(ex,t>l?10:t==l?5:2)});
 add('Experience fit',ex,10,ex>=10?'Right experience level':'');
 const tags=u.projects.flatMap(p=>p.t.map(x=>x.toLowerCase())).concat(uT),ov=mL.filter(n=>tags.includes(n)).length;
 add('Learning goal alignment',10*Math.min(1,ov/2),10,ov?'Projects match your goals':'');
 let a=null;if(me.av?.length&&u.av?.length){const s=me.av.filter(x=>u.av.includes(x)).length;a=10*s/Math.min(me.av.length,u.av.length)}
 add('Availability overlap',a??0,10,a?'Time overlap':a===null?'Availability not set':'');if(a===null)P[4].skip=1;
 add('Language match',me.lang&&me.lang===u.lang?5:0,5,me.lang===u.lang?'Shared language':'');
 const pt=(me.projects||[]).flatMap(p=>p.t.map(x=>x.toLowerCase())),up=u.projects.flatMap(p=>p.t.map(x=>x.toLowerCase()));
 add('Project relevance',5*Math.min(1,pt.filter(x=>up.includes(x)).length/2),5,'');
 const max=P.filter(p=>!p.skip).reduce((s,p)=>s+p.max,0),tot=P.reduce((s,p)=>s+(p.skip?0:p.v),0);
 return{pct:Math.round(tot/max*100),P,got,give,type:got.length&&give.length?'x':got.length?'l':'p',
  why:P.filter(p=>p.note&&p.v>0||p.skip&&p.note).sort((a,b)=>b.v-a.v).slice(0,3).map(p=>p.note)}}

function auth(){const up=S.mode=='up',e=S.err;return`<div class="wrap" style="max-width:420px"><div class="card"><h2>${up?'Create your account':'Welcome back'}</h2>
<label for="em">Email</label><input id="em" type="email" value="${esc(S.em||'')}"><div class="err">${e.em||''}</div>
<label for="pw">Password</label><input id="pw" type="password"><div class="err">${e.pw||''}</div>
<div class="row" style="margin-top:14px"><button class="btn" onclick="doAuth()">${up?'Sign up':'Sign in'}</button><button class="btn g" onclick="toast('GitHub sign-in is simulated in this prototype');S.em='dev@github.local';doAuth(1)">Continue with GitHub</button></div>
<p class="mut"><a href="#" onclick="S.mode='${up?'in':'up'}';S.err={};render();return false">${up?'Have an account? Sign in':'New here? Sign up'}</a> ${up?'':' · <a href="#" onclick="toast(\'Password reset is handled by the platform\');return false">Forgot password</a>'}</p></div></div>`}
function doAuth(gh){const em=gh?S.em:$('#em').value.trim(),pw=gh?'x':$('#pw').value;S.em=em;S.err={};
 if(!/^\S+@\S+\.\S+$/.test(em))S.err.em='Enter a valid email address';if(pw.length<6)S.err.pw='Password must be at least 6 characters';
 if(S.mode=='in'&&!S.err.em&&!S.err.pw&&(!db.me||db.me.email!==em))S.err.pw='Email or password is incorrect. Try again.';
 if(Object.keys(S.err).length)return render();
 if(S.mode=='up'||!db.me){db.me={id:'me',email:em,name:'',bio:'',loc:'',lang:'English',av:[],learn:[],teach:[],projects:[],gh:!!gh};db.done=false;db.conns=[];db.msgs={};db.ex=[];db.projects=[];db.blocked=[];db.searches=[];save()}
 S.D=JSON.parse(JSON.stringify(db.me));S.step=0;S.view=db.done?'app':'onb';S.tab='home';render()}
/* ---------- onboarding ---------- */
function onb(){const D=S.D,st=S.step,e=S.err,pct=Math.round(st/4*100);
 const tl=['About you','Skills I want to learn','Skills I can teach','Current and previous projects'];
 let b='';
 if(st==0)b=`<label for="n">Name</label><input id="n" value="${esc(D.name)}"><div class="err">${e.n||''}</div>
 <label for="bio">Short bio (${D.bio.length}/280)</label><textarea id="bio" oninput="D2('bio',this.value)">${esc(D.bio)}</textarea><div class="err">${e.bio||''}</div>
 ${locField(D)}
 <label for="lg">Preferred language</label><select id="lg">${['English','Spanish','Hindi','Tamil','German'].map(l=>`<option ${D.lang==l?'selected':''}>${l}</option>`).join('')}</select>
 <label>Availability</label><div class="row">${AV.map(a=>`<button class="chip ${D.av.includes(a)?'on':''}" aria-pressed="${D.av.includes(a)}" onclick="grab();tg('${a}')">${a}</button>`).join('')}</div>
 <label for="ph">Profile photo (JPG/PNG, under 5MB)</label><input id="ph" type="file" accept="image/jpeg,image/png" onchange="if(this.files[0]&&this.files[0].size>5e6){S.err.ph='Image must be JPG/PNG under 5MB';this.value='';grab();render()}"><div class="err">${e.ph||''}</div>`;
 if(st==1||st==2){const L=st==1,k=L?'learn':'teach';
  b=`<datalist id="sk">${SK.map(s=>`<option>${s}</option>`).join('')}</datalist>
  ${D[k].length?D[k].map((s,i)=>`<div class="card row sp" style="margin:8px 0"><div><b>${esc(s.n)}</b> <span class="badge">${s[L?'l':'e']}</span><div class="mut">${esc(L?s.g:s.w)}</div></div><div><button class="btn g sm" onclick="mv('${k}',${i})" aria-label="Move up">↑</button> <button class="btn g sm" onclick="rm('${k}',${i})" aria-label="Remove">Remove</button></div></div>`).join(''):`<p class="mut">${L?'You haven’t added any learning goals yet. Try “Python” or “UI/UX”.':'Nothing to teach yet. Add a skill someone could learn from you.'}</p>`}
  <div class="card stack"><label for="ss">Skill name</label><select id="ss" onchange="pickSk(this)"><option value="">Choose a skill…</option><option value="__o">Others (type your own skill)</option>${SK.map(x=>`<option>${x}</option>`).join('')}</select><input id="sn" aria-label="Type your own skill" placeholder="Type your own skill, e.g. Cooking" style="display:none;margin-top:8px" onkeydown="ent(event)"><label for="sl">${L?'Current level':'Experience level'}</label><select id="sl">${(L?LV.slice(0,3):LV).map(x=>`<option>${x}</option>`).join('')}</select>
  <label for="sg">${L?'Learning goal':'Teaching willingness'}</label>${L?'<input id="sg" placeholder="What do you want to do with it?" onkeydown="ent(event)">':`<select id="sg">${WL.map(x=>`<option>${x}</option>`).join('')}</select>`}<div class="err">${e.s||''}</div><button class="btn sm" onclick="addSk('${k}')">Add skill</button></div>`}
 if(st==3)b=projForm();
 return`<div class="wrap" style="max-width:640px"><span class="logo">SkillBridge</span><div class="card stack"><div class="row sp"><b>Step ${st+1} of 4: ${tl[st]}</b><span class="mut">${pct}% complete</span></div><div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>${S.focus=='teach'&&st==0?'<p class="mut">You chose Share Your Skills. You’ll add what you can teach in step 3.</p>':''}${b}
 <div class="row sp"><button class="btn g" ${st?'':'disabled style="opacity:.4"'} onclick="grab();S.step--;render()">Back</button><button class="btn" onclick="nxt()">${st==3?'Finish':'Next'}</button></div></div></div>`}
const grab=()=>{if(S.step==0){const D=S.D;D.name=$('#n')?.value??D.name;D.bio=$('#bio')?.value??D.bio;D.country=$('#cty')?.value??D.country;if($('#loc'))D.loc=$('#loc').value=='__o'?($('#locx')?.value||''):$('#loc').value;else if($('#locx'))D.loc=$('#locx').value;D.lang=$('#lg')?.value??D.lang}};
const D2=(k,v)=>{S.D[k]=v};const tg=a=>{const v=S.D.av;v.includes(a)?v.splice(v.indexOf(a),1):v.push(a);render()};
const rm=(k,i)=>{S.D[k].splice(i,1);render()};const mv=(k,i)=>{const a=S.D[k];if(i>0)[a[i-1],a[i]]=[a[i],a[i-1]];render()};
function pickSk(el){const o=el.value=='__o',i=$('#sn');i.style.display=o?'block':'none';i.value=o?'':el.value;if(o)i.focus()}
function ent(e){if(e.key=='Enter')addSk(S.step==1?'learn':'teach')}
function pend(){let n=$('#sn')?.value.trim();if(!n||(S.step!=1&&S.step!=2))return;n=normSk(n);const k=S.step==1?'learn':'teach';if(S.D[k].some(x=>x.n.toLowerCase()==n.toLowerCase()))return;S.D[k].push(k=='learn'?{n,l:$('#sl').value,g:$('#sg').value}:{n,e:$('#sl').value,w:$('#sg').value})}
const normSk=n=>{n=n.trim().replace(/\s+/g,' ');return SK.find(s=>s.toLowerCase()==n.toLowerCase())||n.charAt(0).toUpperCase()+n.slice(1)};

 if(S.D[k].some(x=>x.n.toLowerCase()==n.toLowerCase())){S.err.s='You already added '+n;return render()}S.err={};const o=k=='learn'?{n,l:$('#sl').value,g:$('#sg').value}:{n,e:$('#sl').value,w:$('#sg').value};S.D[k].push(o);render()}

function rec(q){q=String(q||'').trim();if(!q)return;db.searches=[q].concat((db.searches||[]).filter(x=>x.toLowerCase()!=q.toLowerCase())).slice(0,8);save()}
function suggest(){const rk=ranked(),conn=db.conns.map(c=>c.uid),out=[];
 for(const q of (db.searches||[]).slice(0,4)){const t=q.toLowerCase();let n=0;
  for(const r of rk){const u=r.u;if(n>=2)break;if(conn.includes(u.id)||out.some(o=>o.r.u.id==u.id))continue;
   const sk=u.teach.filter(s=>s.n.toLowerCase().includes(t)).map(s=>s.n),pj=u.projects.some(p=>(p.n+' '+(p.t||[]).join(' ')).toLowerCase().includes(t));
   if(sk.length||pj||u.name.toLowerCase().includes(t)){out.push({q,r,sk});n++}}}
 return out.slice(0,6)}
function sugSec(){const s=db.searches||[],L=suggest();
 const head=`<div class="sugh"><div><h2 style="margin:0">${t('sugh')}</h2><div class="mut">Profiles based on what you looked for before</div></div>${s.length?'<button class="btn g sm" onclick="db.searches=[];save();render()">Clear history</button>':''}</div>`;
 if(!s.length)return head+'<div class="card" style="margin-top:12px">Nothing searched yet. Look up a skill above and people who can teach it will show up here next time.</div>';
 const chips=`<div class="row" style="margin:12px 0"><span class="mut">Recent</span>${s.slice(0,6).map(q=>`<button class="chip" data-q="${esc(q)}" onclick="go('discover',{q:this.dataset.q})">↺ ${esc(q)}</button>`).join('')}</div>`;
 if(!L.length)return head+chips+'<div class="card">No profiles matched your recent searches yet. Try Discover with a broader term.</div>';
 return head+chips+'<div class="grid3" style="margin-bottom:20px">'+L.map(({q,r,sk})=>{const u=r.u,m=r.m;
  return`<article class="card sug t-${m.type}"><div class="why">Because you searched “${esc(q)}”</div><div class="row">${av(u)}<div style="flex:1;min-width:0"><b>${esc(u.name)}</b>${ratingTag(u.id)}<div class="mut">${esc(place(u))} · ${esc(u.lang)}</div></div>
  <button class="ring sm" style="--p:${m.pct};--c:${m.pct>=70?'#19d6b0':m.pct>=40?'#7a7bff':'#f0a64a'}" onclick="breakdown('${u.id}')" aria-label="${m.pct}% match. Show breakdown"><b>${m.pct}%</b></button></div>
  <div class="mut">${esc(u.bio)}</div><div><span class="mut">Teaches </span>${bd((sk.length?sk:u.teach.map(t=>t.n)).slice(0,4))}</div>
  <div class="row"><button class="btn sm" onclick="connectM('${u.id}','Learn')">Connect</button><button class="btn g sm" onclick="viewP('${u.id}')">View Profile</button></div></article>`}).join('')+'</div>'}

 ${L.filter(r=>r.j<5||r.me).map(r=>`<div class="row sp" style="padding:7px 12px;border-radius:14px;${r.me?'background:var(--soft);border:1px solid var(--pri)':''}"><span><b>${['🥇','🥈','🥉'][r.j]||'#'+(r.j+1)}</b> ${r.me?'You':esc(r.u.name)}</span><b>${r.x}</b></div>`).join('')}
 <div class="mut">${nx?`${nx.x-mine+1} XP to pass ${esc(nx.u.name.split(' ')[0])}. Tick roadmap steps, schedule sessions and connect to climb.`:'You are #1 this week 🎉'}</div><div class="mut" style="font-size:12.5px">Sample community scores for this prototype</div></div>`}
const rouletteCard=()=>`<div class="card row sp"><div><h3 style="margin:0">🎲 Skill roulette</h3><div class="mut">Not sure who to talk to? Spin to meet someone from your top matches.</div></div><div id="rl" class="row" style="flex:1;justify-content:flex-end"><button class="btn" onclick="spin()">Spin</button></div></div>`;
function spin(){const c=db.conns.map(x=>x.uid),pool=ranked().filter(r=>!c.includes(r.u.id)).slice(0,5);if(!pool.length)return toast('You have already connected with everyone here!');
 const pick=pool[Math.floor(Math.random()*pool.length)],el=$('#rl');
 const fin=()=>{el.innerHTML=`<div class="row">${av(pick.u)}<div><b>${esc(pick.u.name)}</b> <span class="rate">${pick.m.pct}% match</span><div class="mut" style="max-width:340px">${esc(whyText(pick.u,pick.m))}</div></div></div><div class="row"><button class="btn sm" onclick="connectM('${pick.u.id}','Learn')">Connect</button><button class="btn g sm" onclick="spin()">Spin again</button></div>`};
 if(RM())return fin();
 let k=0;const iv=setInterval(()=>{if(!document.body.contains(el)){clearInterval(iv);return}if(++k>14){clearInterval(iv);return fin()}el.innerHTML=`<b style="font-size:20px">${esc(pool[k%pool.length].u.name)}</b>`},90)}
function confetti(){if(RM())return;const cs=['#2ee6c5','#7a7bff','#ff8a65','#f0a64a'];
 for(let i=0;i<40;i++){const e=document.createElement('i');e.style.cssText=`position:fixed;top:-12px;left:${Math.random()*innerWidth}px;width:8px;height:12px;background:${cs[i%4]};z-index:40;pointer-events:none;border-radius:2px`;document.body.append(e);
  e.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translate(${Math.random()*160-80}px,${innerHeight+30}px) rotate(${Math.random()*720}deg)`,opacity:.9}],{duration:1400+Math.random()*1200,easing:'ease-in'}).onfinish=()=>e.remove()}}

 <div class="hctl"><span class="scap" id="scap" aria-live="off">${t(IMGS[sl].k)}</span><div class="dots"><button class="sarr" aria-label="Previous slide" onclick="slideTo((S.slide||0)-1)">‹</button>${IMGS.map((s,i)=>`<button class="dot ${i==sl?'on':''}" aria-label="Show slide ${i+1}" aria-current="${i==sl}" onclick="slideTo(${i})"></button>`).join('')}<button class="sarr" aria-label="Next slide" onclick="slideTo((S.slide||0)+1)">›</button></div></div></div>
 ${me.learn.length+me.teach.length+me.projects.length<3?'<div class="card" style="margin-bottom:14px">Complete your profile to get better matches. <button class="btn sm" onclick="go(\'profile\')">Edit profile</button></div>':''}

 ${V[hv]()}`}
function discover(){const f=S.f,q=S.q.trim().toLowerCase(),T=S.dt||'people';
 const sel=(k,o,l)=>`<label>${l}</label><select onchange="S.f.${k}=this.value;render()"><option value="">Any</option>${o.map(x=>`<option ${f[k]==x?'selected':''}>${x}</option>`).join('')}</select>`;
 const tabs=`<div class="row" style="margin-bottom:12px"><button class="chip ${T=='people'?'on':''}" aria-pressed="${T=='people'}" onclick="S.dt='people';render()">People</button><button class="chip ${T=='projects'?'on':''}" aria-pressed="${T=='projects'}" onclick="S.dt='projects';render()">Project showcase</button></div>`;
 let main;
 if(T=='projects'){let ps=[];SEED.filter(u=>!db.blocked.includes(u.id)).concat([db.me]).forEach(u=>u.projects.filter(p=>p.pub!==false).forEach(p=>ps.push({u,p})));
  if(q)ps=ps.filter(x=>(x.p.n+' '+(x.p.t||[]).join(' ')+' '+(x.p.d||'')+' '+(x.p.c||'')).toLowerCase().includes(q));
  if(f.st)ps=ps.filter(x=>(x.p.st||'Previous')==f.st);
  main=`<h2>${ps.length} projects${q?' for “'+esc(S.q)+'”':''}</h2>${ps.length?'<div class="grid3">'+ps.map(x=>`<article class="card stack"><div class="row">${av(x.u)}<div><b>${x.u.id=='me'?'You':esc(x.u.name)}</b><div class="mut">${esc(place(x.u))}</div></div></div>${projList([x.p])}<div class="row"><button class="btn g sm" onclick="viewP('${x.u.id}')">View profile</button>${x.u.id=='me'?'':`<button class="btn sm" onclick="connectM('${x.u.id}','Learn')">Connect</button>`}</div></article>`).join('')+'</div>':'<div class="card">No projects match. Try a broader term like “web” or “data”, or post your own.</div>'}`}
 else{let r=ranked();
  if(q)r=r.filter(x=>(f.mode=='teach'?x.u.teach:x.u.learn).some(t=>t.n.toLowerCase().includes(q))||x.u.name.toLowerCase().includes(q)||x.u.projects.some(p=>(p.n+' '+(p.t||[]).join(' ')).toLowerCase().includes(q)));
  if(f.lv)r=r.filter(x=>x.u.teach.some(t=>t.e==f.lv));if(f.lang)r=r.filter(x=>x.u.lang==f.lang);if(f.av)r=r.filter(x=>x.u.av.includes(f.av));
  main=`<h2>${r.length} people${q?' for “'+esc(S.q)+'”':''}</h2>${r.length?'<div class="grid3">'+r.map(pcard).join('')+'</div>':`<div class="card">No users match all selected filters. Try removing one, or a broader term (“machine learning” → “AI”). <div style="margin-top:10px"><button class="btn sm" onclick="newProj()">Create a project looking for this skill</button></div></div>`}`}
 return`<div class="grid"><aside class="card" aria-label="Filters"><h3>Filters</h3><label>Search ${T=='people'?'skill, person or project':'projects and technologies'}</label><input value="${esc(S.q)}" onkeydown="if(event.key=='Enter'){S.q=this.value;rec(S.q);render()}">
 ${T=='people'?`<label>Show people who</label><select onchange="S.f.mode=this.value;render()"><option value="teach" ${f.mode=='teach'?'selected':''}>Can teach</option><option value="learn" ${f.mode=='learn'?'selected':''}>Want to learn</option></select>${sel('lv',LV,'Experience level')}${sel('lang',['English','Spanish'],'Language')}${sel('av',AV,'Availability')}`:sel('st',['Current','Previous'],'Status')}
 <button class="btn g sm" style="margin-top:12px" onclick="S.f={lv:'',lang:'',av:'',mode:'teach'};S.q='';render()">Clear all</button></aside><section>${tabs}${main}</section></div>`}
function connectM(id,intent){const u=U(id);ov(`<div class="modal"><div class="card" role="dialog" aria-label="Connect"><h2>Connect with ${esc(u.name)}</h2><label>Intent</label><select id="ci">${['Learn','Exchange','Build'].map(x=>`<option ${x==intent?'selected':''}>${x}</option>`).join('')}</select><label>Note</label><textarea id="cn">${intent=='Learn'&&score(db.me,u).got[0]?'I want to learn '+esc(score(db.me,u).got[0]):''}</textarea>
 <div class="row" style="margin-top:12px"><button class="btn" onclick="doConn('${id}')">Send request</button><button class="btn g" onclick="ov()">Cancel</button></div></div></div>`)}
function doConn(id){if(db.conns.some(c=>c.uid==id)){ov();return toast('Already connected or pending')}
 const c={uid:id,intent:$('#ci').value,s:'pending'};db.conns.push(c);db.msgs[id]=[{f:'me',t:$('#cn').value||'Hi! I’d love to connect.'}];save();ov();toast('Request sent');

function messages(){const cs=db.conns.filter(c=>!db.blocked.includes(c.uid));
 if(!cs.length)return`<div class="card">You have no connections yet. Try searching for someone to learn from. <button class="btn sm" onclick="go('discover')">Discover people</button></div>`;
 const id=S.chat&&cs.some(c=>c.uid==S.chat)?S.chat:cs[0].uid,c=cs.find(x=>x.uid==id),u=U(id),ms=db.msgs[id]||[];
 return`<div class="grid"><aside class="card"><h3>Connections</h3>${cs.map(x=>`<button class="chip" style="width:100%;margin:3px 0;text-align:left;${x.uid==id?'border-color:var(--pri)':''}" onclick="S.chat='${x.uid}';render()">${esc(U(x.uid).name)} <span class="mut">${x.s}</span></button>`).join('')}</aside>
 <section class="card stack"><div class="row sp"><h3 style="margin:0">${esc(u.name)}</h3><div><button class="btn g sm" onclick="schedM('${id}')">Schedule</button> <button class="btn g sm" onclick="proposeM('${id}')">Propose exchange</button> <button class="btn g sm" onclick="newProj('${id}')">Create project</button></div></div>
 ${c.s=='pending'?'<div class="mut">Request pending <button class="btn g sm" onclick="db.conns=db.conns.filter(x=>x!==db.conns.find(y=>y.uid==\''+id+'\'));save();render()">Cancel request</button></div>':''}
 <div class="chat" aria-live="polite">${ms.length?ms.map(m=>`<div class="msg ${m.f=='me'?'me':''}">${esc(m.t)}</div>`).join(''):'<p class="mut">Say hello and introduce what you want to learn.</p>'}</div>

 <details><summary>Shared resources (${(db.msgs[id+'r']||[]).length})</summary>${(db.msgs[id+'r']||[]).map(r=>`<div>• ${/^https?:/.test(r)?`<a href="${esc(r)}" target="_blank" rel="noopener">${esc(r)}</a>`:esc(r)}</div>`).join('')||'<p class="mut">No shared resources yet. Add a tutorial or an idea.</p>'}
 <div class="row"><input id="ri" style="flex:1" aria-label="Resource" placeholder="Note, tutorial, YouTube or GitHub link"><button class="btn g sm" onclick="addRes('${id}')">Add</button></div></details></section></div>`}
function send(id){const v=$('#mi').value.trim();if(!v)return;db.msgs[id].push({f:'me',t:v});save();render();
 setTimeout(()=>{db.msgs[id].push({f:id,t:'Thanks! Let’s find a time this week.'});save();if(S.tab=='messages'&&S.chat==id)render()},1600)}

 return`<h2>Skill exchange opportunities</h2><div class="grid3">${opp.map(pcard).join('')||'<div class="card">No reciprocal matches yet. Add skills you can teach.</div>'}</div>

 return`<div class="row sp"><h2>Projects</h2><button class="btn" onclick="newProj()">Create project</button></div>${db.projects.length?'<div class="grid3">'+db.projects.map((p,i)=>`<div class="card stack"><h3>${esc(p.name)}</h3><div>${bd(p.skills)}</div><div class="bar"><i style="width:${prog(p)}%"></i></div><div class="mut">${prog(p)}% · ${p.members.length} members</div><button class="btn sm" onclick="S.proj=${i};render()">Open workspace</button></div>`).join('')+'</div>':'<div class="card">No projects yet. Create one, or start from a match.</div>'}`}
const prog=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.s=='Done').length/p.tasks.length*100):0;
function newProj(inv){ov(`<div class="modal"><div class="card" role="dialog" aria-label="Create project"><h2>Create project</h2><label for="pn">Project name</label><input id="pn"><label for="pd">Description</label><textarea id="pd"></textarea><label for="ps">Skills required (comma separated)</label><input id="ps" placeholder="Python, UI/UX"><label for="pz">Team size</label><input id="pz" type="number" min="2" value="3"><label for="pv">Visibility</label><select id="pv"><option>Open</option><option>Invite-only</option></select><div class="err" id="pe"></div>

 db.projects.push({name,desc:$('#pd').value,skills:sk,size:sz,vis:$('#pv').value,members:[{id:'me',role:'Lead'}].concat(inv?[{id:inv,role:'Invited',pending:1}]:[]),tasks:[],res:[],chat:[]});save();ov();S.proj=db.projects.length-1;go('projects')}

 <div class="grid3" style="margin-top:14px"><div class="card stack"><h3>Team (${p.members.length}/${p.size})</h3>${p.members.map(m=>`<div class="row">${av(U(m.id))}<div>${esc(U(m.id).name||'You')}<div class="mut">${m.role}${m.pending?' (pending)':''}</div></div></div>`).join('')}
 <h3>Recommended</h3>${rec.map(u=>`<div class="row sp"><span>${esc(u.name)}</span><button class="btn g sm" onclick="inv(${i},'${u.id}')">Invite</button></div>`).join('')||'<p class="mut">No matches found. Expand the skill list or invite manually.</p>'}</div>
 <div class="card stack"><h3>Tasks</h3>${p.tasks.map((t,j)=>`<div class="row sp"><span>${esc(t.t)}</span><button class="chip" onclick="cyc(${i},${j})">${t.s}</button></div>`).join('')||'<p class="mut">Create your first task.</p>'}<div class="row"><input id="tt" aria-label="Task title" style="flex:1" placeholder="New task"><button class="btn g sm" onclick="addT(${i})">Add</button></div></div>

 <h3>Discussion</h3>${p.chat.map(r=>`<div class="mut">${esc(r)}</div>`).join('')}<div class="row"><input id="tc" aria-label="Message" style="flex:1" placeholder="Message the team"><button class="btn g sm" onclick="p_(${i},'chat','tc')">Send</button></div></div></div>`}
const inv=(i,id)=>{const p=db.projects[i];if(p.members.some(m=>m.id==id))return toast('Already a member');p.members.push({id,role:'Invited',pending:1});save();render();setTimeout(()=>{const m=p.members.find(m=>m.id==id);if(m){m.pending=0;m.role='Member';save();if(S.tab=='projects')render()}},2200)};

function evCard(e,i){const host=e.host=='me',L=safeU(e.meet),going=e.rsvp&&e.rsvp.me=='yes';
 return`<div class="card stack" style="padding:14px"><div class="row sp"><div><b>${esc(e.title)}</b><div class="mut">${dfmt(new Date(e.date+'T00:00:00'))} · ${e.time}–${e.end} · hosted by ${host?'You':esc(U(e.host).name)}</div>${e.topic?`<div class="mut">${esc(e.topic)}</div>`:''}</div>${L?'<span class="badge">Meet ready</span>':'<span class="badge l">No Meet link yet</span>'}</div>
 <div>${e.inv.map(k=>{const s=(e.rsvp||{})[k],n=k=='me'?'You':U(k).name.split(' ')[0];return`<span class="badge ${s=='yes'?'':'l'}" style="--h:${hue(n)}">${s=='yes'?'✓':s=='maybe'?'?':'…'} ${esc(n)}</span>`}).join('')}</div>
 <div class="row">${L?aBtn(esc(L),'Join Google Meet'):host?'<button class="btn sm" onclick="meetNew()">Create Meet link</button>':'<span class="mut">The host will add the Meet link.</span>'}${!host&&e.inv.includes('me')?`<button class="btn g sm" onclick="evGo(${i})">${going?'Going ✓':'I’m going'}</button>`:''}${aBtn(gcal(e),'Add to Google Calendar','g')}<button class="btn g sm" onclick="ring(${i})">Test call</button>${host?`<button class="btn g sm" onclick="evDel(${i})">Cancel</button>`:''}</div>
 ${host&&!L?`<div class="row"><input id="ml${i}" aria-label="Paste Meet link" style="flex:1" placeholder="Paste the Meet link here"><button class="btn g sm" onclick="evLink(${i})">Save link</button></div>`:''}</div>`}

function evM(r){if(!S.ev||r)S.ev={title:'',topic:'',di:0,time:'19:00',dur:60,inv:[],meet:''};const e=S.ev,M=SEED.filter(u=>!db.blocked.includes(u.id));
 ov(`<div class="modal" onclick="if(event.target==this)ov()"><div class="card" role="dialog" aria-label="Schedule a community session"><h2>Schedule a session</h2>
 <label for="et">Title</label><input id="et" value="${esc(e.title)}" oninput="S.ev.title=this.value" placeholder="e.g. Python study circle"><label for="eo">Topic (optional)</label><input id="eo" value="${esc(e.topic)}" oninput="S.ev.topic=this.value">
 <label>Day</label><div class="row">${days7().map((d,i)=>`<button class="chip ${i==e.di?'on':''}" aria-pressed="${i==e.di}" onclick="S.ev.di=${i};evM()">${dfmt(d)}</button>`).join('')}</div>
 <div class="row"><div style="flex:1"><label for="ei">Start time</label><input id="ei" type="time" value="${e.time}" oninput="S.ev.time=this.value"></div><div style="flex:1"><label for="ed">Length</label><select id="ed" onchange="S.ev.dur=+this.value">${[30,60,90].map(x=>`<option value="${x}" ${x==e.dur?'selected':''}>${x} min</option>`).join('')}</select></div></div>
 <label>Invite members (they get a call alert when it starts)</label><div class="row">${M.map(u=>`<button class="chip ${e.inv.includes(u.id)?'on':''}" aria-pressed="${e.inv.includes(u.id)}" onclick="evInv('${u.id}')">${esc(u.name.split(' ')[0])}</button>`).join('')}<button class="chip" onclick="evAll()">Invite all</button></div>

const evInv=id=>{const a=S.ev.inv,k=a.indexOf(id);k<0?a.push(id):a.splice(k,1);evM()},evAll=()=>{S.ev.inv=SEED.filter(u=>!db.blocked.includes(u.id)).map(u=>u.id);evM()};
async function evSave(){const e=S.ev,er=$('#ee');e.title=e.title.trim();
 if(!e.title)return er.textContent='Give the session a title.';if(!e.inv.length)return er.textContent='Invite at least one member.';if(!/^\d\d:\d\d$/.test(e.time))return er.textContent='Pick a start time.';
 if(e.meet&&!/^https:\/\//i.test(e.meet))return er.textContent='The Meet link must start with https://';
 const d=ds(days7()[e.di]),[h,m]=e.time.split(':').map(Number),en=new Date(2000,0,1,h,m+e.dur),end=en.getDate()!=1?'23:59':String(en.getHours()).padStart(2,'0')+':'+String(en.getMinutes()).padStart(2,'0');
